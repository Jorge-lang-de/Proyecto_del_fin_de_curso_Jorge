<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi Inmobiliaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilo_registro.css">
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/mrMn6wPS/logo.png">
</head>
<body>
<br><br><br><br><br><br>
<div class="container">
    <div class="registro-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Iniciar sesion</h2>
            <p class="text-muted">¡Empieza a buscar tu casa!</p>
        </div>

        <form id="loginForm">
    <div class="mb-3">
        <label class="form-label">Nombre Completo</label>
        <!-- Añadimos id="nombreInput" -->
        <input type="text" id="nombreInput" class="form-control" placeholder="Tu nombre" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" placeholder="Crea una clave segura" required>
    </div>
    
    <!-- Cambiamos el <a> por un <button> de tipo submit -->
    <button type="submit" class="btn btn-primario w-100 py-2 mb-3">Iniciar sesión</button>
    
    <div class="text-center">
        <small>¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Registrarse</a></small>
    </div>
</form>

<script>
    // Seleccionamos el formulario y el input
    const formulario = document.querySelector('form');
    const inputNombre = document.querySelector('input[type="text"]');
    // Escuchamos el evento de envío del formulario
    formulario.addEventListener('submit', function(e) {
        e.preventDefault(); // Detenemos el envío automático
        // Obtenemos el valor del input
        const nombre = inputNombre.value;
        // Validamos que el nombre no esté vacío
        if (nombre.trim() !== "") {
            // Guardamos el nombre en la "memoria" del navegador
            localStorage.setItem('usuarioNombre', nombre);
            // Redirigimos al inicio
            window.location.href = "../index.html";
        } else {
            alert("Por favor, ingresa tu nombre");
        }
    });
</script>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

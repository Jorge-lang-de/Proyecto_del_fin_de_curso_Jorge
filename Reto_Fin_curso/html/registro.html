<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi Inmobiliaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilo_registro.css">
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/mrMn6wPS/logo.png">
</head>
<body>
<br><br><br><br>
<div class="container">
    <div class="registro-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Crear Cuenta</h2>
            <p class="text-muted">¡Empieza a buscar tu casa!</p>
        </div>

        <form id="registroForm">
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" placeholder="Tu nombre" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="Crea una clave segura" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Repetir Contraseña</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirma tu clave" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">Registrarme</button>
            
            <div class="text-center">
                <small>¿Ya tienes cuenta? <a href="login.html" class="text-decoration-none">Inicia sesión</a></small>
            </div>
        </form>
    </div>
</div>

<script>
    // 1. Seleccionamos el formulario que se llama "registroForm"
    const form = document.getElementById("registroForm");

    // 2. Escuchamos el evento de envío del formulario
    form.addEventListener("submit", function (event) {
        
        
        // Detenemos el envío inmediatamente, sin importar nada más.
        event.preventDefault();
        console.log("Evento detenido. Validando...");

        // 3. Obtenemos los valores
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        // 3. Validación de Correo
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert("Por favor, introduce un correo electrónico válido.");
            return; // Salimos de la función aquí
        }

        // 4. Validamos
        if (password !== confirm) {
            alert("¡Error! Las contraseñas no coinciden. No se enviará el formulario.");
            // Al hacer return aquí, el código termina y NUNCA llega al envío.
            return;
        }

        if (password.length < 5) {
            alert("La contraseña es demasiado corta.");
            return;
        }

        // 5. Si todo está perfecto, enviamos manualmente
        alert("¡Todo correcto! Enviando...");
        this.submit(); // Solo aquí se envía el formulario de verdad
    });
</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
